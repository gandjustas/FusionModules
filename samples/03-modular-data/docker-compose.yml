# Three services. One image. The difference between them is an environment variable.
#
#   docker compose up --build
#   curl localhost:5011/customers        (customers)
#   curl localhost:5012/billing/overdue  (billing)
#   curl localhost:5010/customers        (monolith — serves both)
#
# This is the argument the whole approach rests on: the deployment topology is configuration,
# not a build. Nothing here was compiled for a particular shape, and the binaries are identical.

services:
  monolith:
    image: modulith-modular-data
    build: &build
      context: ../..
      dockerfile: samples/03-modular-data/Dockerfile
    ports: ["5010:8080"]
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=modular;Username=demo;Password=demo;Maximum Pool Size=90
      HOSTINGSTARTUPASSEMBLIES: Orders.Entities;Customers.Entities;CustomersModule;BillingModule
    # The long form, because the short one waits for the container to start and not for the
    # database to accept connections. This replica migrates on startup, so it loses that race and
    # exits — intermittently by hand, and reliably on a cold CI machine.
    depends_on:
      postgres:
        condition: service_healthy

  customers:
    image: modulith-modular-data
    build: *build
    ports: ["5011:8080"]
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=modular;Username=demo;Password=demo;Maximum Pool Size=45
      # Entities and endpoints for customers, and nothing about orders: this replica's model has
      # one table in it.
      HOSTINGSTARTUPASSEMBLIES: Customers.Entities;CustomersModule
      # Only one replica should own the schema. The others take the database as they find it.
      Database__Migrate: "false"
    depends_on:
      postgres:
        condition: service_healthy
      monolith:
        condition: service_started

  billing:
    image: modulith-modular-data
    build: *build
    ports: ["5012:8080"]
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=modular;Username=demo;Password=demo;Maximum Pool Size=45
      # BillingModule joins orders to customers, so it needs both entity modules loaded — and
      # ModuleBase fails startup rather than serving a broken endpoint if one is missing.
      # The composing module goes last: its configuration has to be applied after theirs.
      HOSTINGSTARTUPASSEMBLIES: Orders.Entities;Customers.Entities;BillingModule
      Database__Migrate: "false"
    depends_on:
      postgres:
        condition: service_healthy
      monolith:
        condition: service_started

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: modular
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d modular"]
      interval: 2s
      timeout: 3s
      retries: 20
