name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # Pushing to a pull request again cancels its runs in flight — four jobs, most of them across two
  # operating systems, and only the last push can be merged anyway. Pushes to main get a group per
  # commit, so nothing cancels a run whose result is the record of that commit.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the version from tags.

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # FusionModules.slnx is the product, samples/Samples.slnx the samples: one project list each.
      - run: dotnet build FusionModules.slnx -c Release -warnaserror
      - run: dotnet build samples/Samples.slnx -c Release -warnaserror

      # MTP mode, selected in global.json: the solution goes behind --solution, and VSTest's
      # --logger is not a thing here. TUnit writes an HTML report of its own.
      - run: dotnet test --solution FusionModules.slnx -c Release --no-build
      - run: dotnet test --solution samples/Samples.slnx -c Release --no-build

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/**'

  skill:
    # The plugin and the portable file are generated from skill/src. Regenerating them here and
    # failing on a diff is what stops the three shapes drifting apart, which they would otherwise
    # do quietly and only be noticed by whoever used the stale one.
    #
    # On Windows too, because assess.ps1 normalises path separators for exactly one reason and
    # that reason was never exercised.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet run --project tools/skillgen

      - name: The portable skill matches its source
        # Only skill/dist is committed — the plugin copy is generated at release time, so there is
        # nothing to drift.
        run: git diff --exit-code -- skill/dist

      - name: The collision detector produces both sections
        # Asserting on the output, not just on exit code: a script that silently finds nothing
        # looks exactly like a passing one. pwsh rather than python so the step is one step on
        # both images — python3 is spelled python on the Windows runner.
        shell: pwsh
        run: |
          $out = Join-Path ([IO.Path]::GetTempPath()) 'collisions.json'
          ./skill/src/assets/scripts/assess.ps1 -Path samples -Output $out
          $keys = (Get-Content -Raw $out | ConvertFrom-Json).PSObject.Properties.Name
          foreach ($section in 'routeCollisions', 'configurationKeyCollisions') {
            if ($keys -notcontains $section) { throw "assess.ps1 produced no '$section'" }
          }

      - name: The plugin manifest is well formed
        # skill/plugin is hand-written and, unlike skill/dist, nothing regenerates it — so nothing
        # would notice it going malformed until somebody tried to install the released zip.
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw skill/plugin/.claude-plugin/plugin.json | ConvertFrom-Json
          foreach ($field in 'name', 'description', 'version') {
            if (-not $manifest.$field) { throw "plugin.json has no '$field'" }
          }
          if (-not (Get-ChildItem skill/plugin/commands -Filter *.md)) { throw 'plugin has no commands' }

      - name: Every relative link resolves
        # The rule pages are what an IDE opens from a squiggle and the README is the only map of
        # the rule set; both are maintained by hand and neither is exercised by a build.
        shell: pwsh
        run: ./eng/check-links.ps1

  docker:
    # The three-topology demonstration in samples/03-modular-data is the argument the README makes,
    # and until now nothing built it. A Dockerfile that no job runs is a Dockerfile that stops
    # working without anybody finding out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: bash eng/docker-smoke.sh

  pack-validate:
    # Consumes the built package from a scratch project outside the repository. Analyzer and
    # MSBuild assets are wired up by project reference in-repo, so nothing else proves that the
    # package layout is right — and when it is wrong the build stays green and the rules go quiet.
    #
    # Windows is not decoration: the script converts paths with cygpath for NuGet under git-bash,
    # and that branch never ran anywhere until this matrix existed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: bash eng/pack-validate.sh

      - name: Samples build against the package, not the projects
        # The inner loop uses project references. This is the configuration a reader of the
        # samples actually gets, and it fails differently.
        run: |
          version=$(basename local-feed/FusionModules.*.nupkg .nupkg | grep -v symbols | head -1)
          version=${version#FusionModules.}
          dotnet restore samples/Samples.slnx \
            -p:FusionModulesUseProjectReferences=false -p:FusionModulesVersion=$version \
            --source ./local-feed --source https://api.nuget.org/v3/index.json
          dotnet build samples/Samples.slnx -c Release --no-restore \
            -p:FusionModulesUseProjectReferences=false -p:FusionModulesVersion=$version

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: local-feed/*.nupkg
