name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # Pushing to a pull request again cancels its runs in flight — four jobs, most of them across two
  # operating systems, and only the last push can be merged anyway. Pushes to main get a group per
  # commit, so nothing cancels a run whose result is the record of that commit.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer derives the version from tags.

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # FusionModules.slnx is the product, samples/Samples.slnx the samples: one project list each.
      - run: dotnet build FusionModules.slnx -c Release -warnaserror
      - run: dotnet build samples/Samples.slnx -c Release -warnaserror

      # MTP mode, selected in global.json: the solution goes behind --solution, and VSTest's
      # --logger is not a thing here. TUnit writes an HTML report of its own.
      - run: dotnet test --solution FusionModules.slnx -c Release --no-build
      - run: dotnet test --solution samples/Samples.slnx -c Release --no-build

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/**'

  skill:
    # The portable files are generated from skill/skills/fusion-modules. Regenerating them here and
    # failing on a diff is what stops them drifting from it, which they would otherwise do quietly
    # and only be noticed by whoever used the stale one.
    #
    # On Windows too, because assess.ps1 normalises path separators for exactly one reason and
    # that reason was never exercised.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet run --project tools/skillgen

      - name: The portable skill matches its source
        run: git diff --exit-code -- skill/dist

      - name: The collision detector produces both sections
        # Asserting on the output, not just on exit code: a script that silently finds nothing
        # looks exactly like a passing one. pwsh rather than python so the step is one step on
        # both images — python3 is spelled python on the Windows runner.
        shell: pwsh
        run: |
          $out = Join-Path ([IO.Path]::GetTempPath()) 'collisions.json'
          ./skill/skills/fusion-modules/assets/scripts/assess.ps1 -Path samples -Output $out
          $keys = (Get-Content -Raw $out | ConvertFrom-Json).PSObject.Properties.Name
          foreach ($section in 'routeCollisions', 'configurationKeyCollisions') {
            if ($keys -notcontains $section) { throw "assess.ps1 produced no '$section'" }
          }

      - name: The plugin and its marketplace are well formed
        # Both manifests are hand-written and nothing regenerates them, so nothing else would
        # notice one going malformed until somebody ran /plugin install. A version in plugin.json
        # is a failure, not a nicety: a marketplace install is then versioned by that string
        # rather than by commit, and until somebody bumps it no push reaches anyone.
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw skill/.claude-plugin/plugin.json | ConvertFrom-Json
          foreach ($field in 'name', 'description') {
            if (-not $manifest.$field) { throw "plugin.json has no '$field'" }
          }
          if ($manifest.PSObject.Properties.Name -contains 'version') {
            throw 'plugin.json has a version, so a marketplace install would never see a new commit'
          }
          if (-not (Test-Path skill/skills/$($manifest.name)/SKILL.md)) { throw 'plugin has no skill' }
          if (-not (Get-ChildItem skill/commands -Filter *.md)) { throw 'plugin has no commands' }

          $marketplace = Get-Content -Raw .claude-plugin/marketplace.json | ConvertFrom-Json
          $entry = $marketplace.plugins | Where-Object name -eq $manifest.name
          if (-not $entry) { throw "marketplace.json does not list '$($manifest.name)'" }
          if (-not (Test-Path (Join-Path $entry.source .claude-plugin/plugin.json))) {
            throw "marketplace.json points '$($manifest.name)' at '$($entry.source)', which is not the plugin"
          }

      - name: Every relative link resolves
        # The rule pages are what an IDE opens from a squiggle and the README is the only map of
        # the rule set; both are maintained by hand and neither is exercised by a build.
        shell: pwsh
        run: ./eng/check-links.ps1

  docker:
    # The three-topology demonstration in samples/03-modular-data is the argument the README makes,
    # and until now nothing built it. A Dockerfile that no job runs is a Dockerfile that stops
    # working without anybody finding out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: bash eng/docker-smoke.sh

  pack-validate:
    # Consumes the built package from a scratch project outside the repository. Analyzer and
    # MSBuild assets are wired up by project reference in-repo, so nothing else proves that the
    # package layout is right — and when it is wrong the build stays green and the rules go quiet.
    #
    # Windows is not decoration: the script converts paths with cygpath for NuGet under git-bash,
    # and that branch never ran anywhere until this matrix existed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - run: bash eng/pack-validate.sh

      - name: Samples build against the package, not the projects
        # The inner loop uses project references. This is the configuration a reader of the
        # samples actually gets, and it fails differently.
        #
        # The sources come from a config file rather than from --source, because on Windows a URL
        # passed that way is resolved as a path relative to each project: NuGet reports that
        # samples\https:\api.nuget.org\v3\index.json does not exist. It surfaces only when a
        # package actually has to be downloaded, so a machine with a warm package folder — every
        # developer's — never sees it and CI sees it every time.
        #
        # pwsh because the step has to be one step on both images, and nothing in it needs a POSIX
        # shell.
        shell: pwsh
        run: |
          $package = Get-ChildItem local-feed/FusionModules.*.nupkg | Select-Object -First 1
          $version = $package.BaseName -replace '^FusionModules\.', ''
          $config = Join-Path ([IO.Path]::GetTempPath()) 'samples-sources.config'
          Set-Content $config '<configuration />'
          dotnet nuget add source https://api.nuget.org/v3/index.json --name nuget --configfile $config
          dotnet nuget add source (Resolve-Path ./local-feed).Path --name local --configfile $config
          dotnet restore samples/Samples.slnx --configfile $config `
            -p:FusionModulesUseProjectReferences=false -p:FusionModulesVersion=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build samples/Samples.slnx -c Release --no-restore `
            -p:FusionModulesUseProjectReferences=false -p:FusionModulesVersion=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: local-feed/*.nupkg
